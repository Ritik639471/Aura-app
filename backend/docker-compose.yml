services:
  aura-chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-chat-api
    restart: always
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - .env
    environment:
      - PORT=5001
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
